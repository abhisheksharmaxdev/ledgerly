# Render Blueprint: New → Blueprint → select this repo.
# One free web service runs the API and serves the built frontend. Data lives in a Turso
# (hosted libSQL) database, so no persistent disk is needed.
services:
  - type: web
    name: ledgerly
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # libsql://<your-db>-<your-org>.turso.io
      - key: DATABASE_AUTH_TOKEN
        sync: false # from `turso db tokens create <db>` or the Turso dashboard
      - key: ADMIN_EMAIL
        sync: false # your admin login email
      - key: ADMIN_PASSWORD_HASH
        sync: false # paste the value printed by `npm run hash-password -- "your password"`
      - key: APP_URL
        sync: false # e.g. https://ledgerly.onrender.com (used in notification emails)
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: SESSION_SECRET
        generateValue: true
